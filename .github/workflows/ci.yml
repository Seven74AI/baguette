name: BAGUETTE CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Godot headless validation
        run: |
          godot --headless --quit 2>&1 | tee /tmp/godot_output.txt
          GODOT_EXIT=${PIPESTATUS[0]}
          if [ $GODOT_EXIT -ne 0 ]; then
            echo "Godot exited with code $GODOT_EXIT"
            exit 1
          fi
          # Filter out known-cosmetic GUT GUI font errors (headless-only, fonts not imported)
          REAL_ERRORS=$(grep -E "ERROR:|SCRIPT ERROR:|FATAL:" /tmp/godot_output.txt | \
            grep -v "addons/gut/fonts/" | \
            grep -v "GutSceneTheme" | \
            grep -v "addons/gut/gui/" || true)
          if [ -n "$REAL_ERRORS" ]; then
            echo "::error::Godot reported real errors in headless validation:"
            echo "$REAL_ERRORS"
            exit 1
          fi
          echo "Godot headless validation passed (exit $GODOT_EXIT)"

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run GUT tests
        run: |
          godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -gjunit_xml_file=res://test-results/junit.xml \
            2>&1 | tee /tmp/gut_output.txt
          if ! grep -q "Failing tests: 0" /tmp/gut_output.txt; then
            echo "::error::GUT tests failed — check output above"
            exit 1
          fi
          echo "All GUT tests passed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
